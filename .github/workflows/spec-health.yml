name: Spec Tree Health

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'linter-scripts/**'
      - '.github/workflows/spec-health.yml'
  pull_request:
    paths:
      - 'spec/**'
      - 'linter-scripts/**'
      - '.github/workflows/spec-health.yml'

jobs:
  health-gate:
    name: Spec tree health gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify required scripts exist
        run: |
          test -f linter-scripts/check-tree-health.cjs || { echo "❌ check-tree-health.cjs missing"; exit 1; }
          test -f linter-scripts/generate-spec-index.cjs || { echo "❌ generate-spec-index.cjs missing"; exit 1; }
          test -f linter-scripts/check-lockstep.cjs || { echo "❌ check-lockstep.cjs missing"; exit 1; }
          test -f linter-scripts/audit-spec-vs-code-v2.py || { echo "❌ audit-spec-vs-code-v2.py missing"; exit 1; }
          echo "✅ All required scripts present."

      - name: Self-heal missing consistency reports, AC, and changelogs
        run: |
          [ -f linter-scripts/fill-missing-consistency-reports.cjs ] && node linter-scripts/fill-missing-consistency-reports.cjs
          [ -f linter-scripts/fill-missing-acceptance-criteria.cjs ] && node linter-scripts/fill-missing-acceptance-criteria.cjs
          [ -f linter-scripts/fill-missing-changelogs.cjs ] && node linter-scripts/fill-missing-changelogs.cjs

      - name: Regenerate spec-index.md (drift check)
        run: |
          node linter-scripts/generate-spec-index.cjs
          if [ -n "$(git status --porcelain spec/)" ]; then
            echo "⚠️  Spec artifacts out of date. Run 'bash linter-scripts/run.sh' locally and commit results."
            git --no-pager diff --stat spec/ | head -20
          else
            echo "✅ Spec artifacts up to date."
          fi

      - name: Spec cross-link gate (zero broken links allowed)
        run: python3 linter-scripts/check-spec-cross-links.py --github

      - name: Spec tree health gate — STRICT (Phase 81, threshold 100)
        # Phase 81: tightened from --min to --strict. Strict mode requires
        # every module to be at full marks (no partial credit). Locks in the
        # 100/100 score achieved in Phase 77 and held since.
        run: node linter-scripts/check-tree-health.cjs --strict --report

      - name: Spec lockstep gate (Phase 81)
        # Phase 81: enforces every §98 changelog entry has a matching §99
        # consistency-report entry on the same date. Held green Phases 77-80.
        run: node linter-scripts/check-lockstep.cjs --strict

      - name: AI-implementability audit v2 gate (Phase 81, deterministic)
        # Phase 81: deterministic v2 audit with floor thresholds. Locks in
        # Phase 80 result (mean weighted 96.3, mean impl 99.5). Floors set
        # ~1 point below current to absorb minor measurement noise while
        # still catching genuine regressions.
        env:
          AUDIT_DETERMINISTIC: '1'
        run: python3 linter-scripts/audit-spec-vs-code-v2.py --min-weighted=95 --min-impl=98

      - name: Trace-map regression gate
        # Runs generate-trace-map.py and compares against the committed baseline at
        # .lovable/memory/audit/trace-map-baseline.json. Fails the build if AC
        # coverage drops, drift grows, orphan code grows, or trace-map.toml
        # references a missing AC / file. Spec: spec/27-spec-toolchain/15-check-trace-map-regression.md
        run: python3 linter-scripts/check-trace-map-regression.py

      - name: Summary
        if: always()
        run: |
          echo "## Spec Cross-Link Result" >> "$GITHUB_STEP_SUMMARY"
          python3 linter-scripts/check-spec-cross-links.py --json 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'{d[\"count\"]} broken link(s)' if d['count'] else '✅ All cross-links resolve.')" >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Spec Tree Health Result" >> "$GITHUB_STEP_SUMMARY"
          node linter-scripts/check-tree-health.cjs --report 2>&1 | head -10 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Trace-map Regression Result" >> "$GITHUB_STEP_SUMMARY"
          python3 linter-scripts/check-trace-map-regression.py --report-only 2>&1 | tail -10 >> "$GITHUB_STEP_SUMMARY" || true
